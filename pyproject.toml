[project]
name = "ai-usage-auditor"
version = "0.1.0"
description = "Scores how AI-driven vs hand-written a repo's commit history looks, with per-commit reasoning."
requires-python = ">=3.11"
dependencies = [
    "GitPython",
    "openai",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
ui = ["streamlit"]

[project.scripts]
audit = "auditor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
